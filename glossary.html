<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Glossary | The Drowned Crown
    </title>

    <link
        rel="stylesheet"
        href="css/glossary.css"
    >

</head>


<body>


    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="site-header">

        <a
            href="index.html"
            class="site-title"
        >
            THE DROWNED CROWN
        </a>


        <nav class="site-nav">

            <a href="index.html#read">
                Read
            </a>

            <a href="index.html#world">
                World
            </a>

            <a href="index.html#people">
                People
            </a>

            <a href="index.html#map">
                Map
            </a>

            <a
                href="glossary.html"
                class="active"
            >
                Glossary
            </a>

        </nav>

    </header>


    <!-- =====================================
         HERO
    ====================================== -->

    <main>

        <section class="glossary-hero">

            <p class="eyebrow">
                THE WORLD OF VEYRA
            </p>

            <h1>
                Glossary
            </h1>

            <p class="hero-description">
                Names, places, peoples,
                languages and terms from
                <em>The Drowned Crown</em>.
            </p>

        </section>


        <!-- =================================
             SEARCH
        ================================== -->

        <section class="glossary-tools">

            <div class="search-wrapper">

                <label
                    for="glossarySearch"
                    class="search-label"
                >
                    Search the world
                </label>

                <input
                    type="search"
                    id="glossarySearch"
                    placeholder="Search Veyra..."
                    autocomplete="off"
                >

            </div>


            <div
                class="category-filters"
                id="categoryFilters"
            >

                <!-- Generated by JavaScript -->

            </div>

        </section>


        <!-- =================================
             RESULTS INFORMATION
        ================================== -->

        <section class="results-header">

            <p id="resultsCount">
                Loading glossary...
            </p>

            <button
                id="spoilerButton"
                class="spoiler-button"
            >
                Spoilers: Reader Progress
            </button>

        </section>


        <!-- =================================
             GLOSSARY
        ================================== -->

        <section
            class="glossary-list"
            id="glossaryList"
        >

            <!-- Generated by JavaScript -->

        </section>


        <!-- =================================
             NO RESULTS
        ================================== -->

        <section
            class="no-results"
            id="noResults"
            hidden
        >

            <div class="no-results-symbol">
                ◆
            </div>

            <h2>
                Nothing Found
            </h2>

            <p>
                No known entry matches
                your search.
            </p>

        </section>

    </main>


    <!-- =====================================
         ENTRY WINDOW
    ====================================== -->

    <div
        class="entry-overlay"
        id="entryOverlay"
        aria-hidden="true"
    >

        <article class="entry-window">

            <button
                class="close-entry"
                id="closeEntry"
                aria-label="Close glossary entry"
            >
                ×
            </button>


            <p
                class="entry-category"
                id="entryCategory"
            >
                Category
            </p>


            <h2 id="entryTitle">
                Entry
            </h2>


            <div
                class="entry-pronunciation"
                id="entryPronunciation"
            >

                <button
                    id="pronounceEntry"
                    class="pronounce-button"
                    aria-label="Hear pronunciation"
                >
                    ▶
                </button>

                <span id="pronunciationText">
                    Pronunciation
                </span>

            </div>


            <div class="entry-divider">
                ◆
            </div>


            <p
                class="entry-description"
                id="entryDescription"
            >
            </p>


            <div
                class="entry-aliases"
                id="entryAliases"
            >
            </div>

        </article>

    </div>


    <!-- =====================================
         FOOTER
    ====================================== -->

    <footer class="site-footer">

        <div>
            ◆
        </div>

        <p>
            THE DROWNED CROWN
        </p>

        <p class="footer-subtitle">
            A Novel of Veyra
        </p>

    </footer>


    <script src="data/chapters.js"></script>

<script src="data/glossary.js"></script>

<script src="data/pronunciations.js"></script>

<script src="js/glossary.js"></script>


</body>

</html>
