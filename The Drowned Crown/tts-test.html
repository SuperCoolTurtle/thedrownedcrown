<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Drowned Crown Narrator Test
    </title>

    <link
        rel="stylesheet"
        href="css/tts-test.css"
    >

</head>


<body>

    <main class="test-shell">

        <header class="test-header">

            <span class="eyebrow">
                THE DROWNED CROWN
            </span>

            <h1>
                Narrator Laboratory
            </h1>

            <p>
                Local neural narration experiment.
                Nothing entered here is sent to a
                text-to-speech API.
            </p>

        </header>


        <section class="test-panel">

            <div class="status-area">

                <span>
                    ENGINE STATUS
                </span>

                <strong id="engineStatus">
                    Not loaded
                </strong>

                <div
                    id="loadingBar"
                    class="loading-bar"
                    hidden
                >

                    <div
                        id="loadingBarFill"
                        class="loading-bar-fill"
                    ></div>

                </div>

                <small id="loadingDetail">
                    Press Load Narrator to begin.
                </small>

            </div>


            <button
                id="loadModelButton"
                class="primary-button"
                type="button"
            >
                LOAD NARRATOR
            </button>


            <div class="field">

                <label for="voiceSelect">
                    NARRATOR VOICE
                </label>

                <select
                    id="voiceSelect"
                    disabled
                >

                    <option value="">
                        Load narrator first
                    </option>

                </select>

            </div>


            <div class="field">

                <label for="speedInput">
                    SPEECH SPEED
                </label>

                <div class="speed-row">

                    <input
                        id="speedInput"
                        type="range"
                        min="0.7"
                        max="1.3"
                        step="0.05"
                        value="1"
                    >

                    <output id="speedOutput">
                        1.00×
                    </output>

                </div>

            </div>


            <div class="field">

                <label for="narrationText">
                    TEST PASSAGE
                </label>

                <textarea
                    id="narrationText"
                    rows="12"
                >The sea had gone quiet.

Polonius watched the black water move beneath the ship, though he could not remember when he had first learned to fear it.

Somewhere beyond the fog, something called across the Mourning Sea.</textarea>

            </div>


            <div class="actions">

                <button
                    id="generateButton"
                    class="primary-button"
                    type="button"
                    disabled
                >
                    GENERATE
                </button>

                <button
                    id="playButton"
                    type="button"
                    disabled
                >
                    PLAY
                </button>

                <button
                    id="stopButton"
                    type="button"
                    disabled
                >
                    STOP
                </button>

            </div>


            <div class="generation-information">

                <span id="generationStatus">
                    No narration generated.
                </span>

            </div>


            <audio
                id="audioPlayer"
                controls
                hidden
            ></audio>

        </section>

    </main>


    <script
        type="module"
        src="js/tts-test.js"
    ></script>

</body>

</html>
