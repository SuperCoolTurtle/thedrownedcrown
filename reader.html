<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Read The Drowned Crown."
    >

    <title>
        The Drowned Crown
    </title>

    <link
        rel="stylesheet"
        href="css/main.css"
    >

    <link
        rel="stylesheet"
        href="css/reader.css"
    >

</head>


<body class="theme-ivory font-medium">


    <!-- =====================================
         READER HEADER
    ====================================== -->

    <header class="reader-header">

        <a
            class="reader-back"
            href="index.html"
        >
            HOME
        </a>


        <div class="reader-header-title">

            <span>
                THE DROWNED CROWN
            </span>

            <small id="headerChapterTitle">
                Loading...
            </small>

        </div>


        <div class="reader-header-actions">

            <button
                id="listenButton"
                class="header-button"
                type="button"
            >
                LISTEN
            </button>


            <button
                id="settingsButton"
                class="header-button"
                type="button"
                aria-label="Reader settings"
            >
                Aa
            </button>

        </div>

    </header>



    <!-- =====================================
         CHAPTER READING PROGRESS
    ====================================== -->

    <div
        class="reading-progress"
        aria-hidden="true"
    >

        <div
            id="readingProgressBar"
            class="reading-progress-bar"
        ></div>

    </div>


    <div
        id="readingPercentage"
        class="reading-percentage"
        aria-hidden="true"
    >
        0%
    </div>



    <!-- =====================================
         READER SETTINGS
    ====================================== -->

    <aside
        id="settingsPanel"
        class="settings-panel"
        hidden
    >

        <div class="settings-header">

            <span>
                READER SETTINGS
            </span>

            <button
                id="closeSettings"
                type="button"
                aria-label="Close reader settings"
            >
                ×
            </button>

        </div>


        <!-- TEXT SIZE -->

        <div class="setting-group">

            <label>
                TEXT SIZE
            </label>

            <div class="setting-buttons">

                <button
                    type="button"
                    data-font-size="small"
                >
                    A
                </button>

                <button
                    type="button"
                    data-font-size="medium"
                >
                    A
                </button>

                <button
                    type="button"
                    data-font-size="large"
                >
                    A
                </button>

            </div>

        </div>


        <!-- READER THEME -->

        <div class="setting-group">

            <label>
                READER THEME
            </label>

            <div class="setting-buttons">

                <button
                    type="button"
                    data-theme="ivory"
                >
                    Ivory
                </button>

                <button
                    type="button"
                    data-theme="paper"
                >
                    Paper
                </button>

                <button
                    type="button"
                    data-theme="night"
                >
                    Night
                </button>

            </div>

        </div>

    </aside>



    <!-- =====================================
         READER PAGE
    ====================================== -->

    <main class="reader-shell">


        <!-- =================================
             CHAPTER OPENING
        ================================== -->

        <section class="chapter-opening">

            <div
                id="chapterLabel"
                class="chapter-label"
            >
                Loading...
            </div>


            <h1
                id="chapterPOV"
                class="chapter-pov"
            >
                —
            </h1>


            <div
                class="chapter-rule"
                aria-hidden="true"
            >

                <span></span>

                <b>
                    ◆
                </b>

                <span></span>

            </div>


            <div
                id="chapterLocation"
                class="chapter-location"
            >
                —
            </div>

        </section>



        <!-- =================================
             MANUSCRIPT
        ================================== -->

        <article
            id="chapterText"
            class="chapter-text"
        >

            <p class="loading-message">
                Loading chapter...
            </p>

        </article>



        <!-- =================================
             CHAPTER NAVIGATION
        ================================== -->

        <nav
            class="chapter-navigation"
            aria-label="Chapter navigation"
        >

            <a
                id="previousChapter"
                class="chapter-nav-link previous"
                href="#"
                hidden
            >

                <span>
                    PREVIOUS
                </span>

                <strong id="previousChapterName">
                    Previous Chapter
                </strong>

            </a>


            <a
                id="nextChapter"
                class="chapter-nav-link next"
                href="#"
                hidden
            >

                <span>
                    NEXT
                </span>

                <strong id="nextChapterName">
                    Next Chapter
                </strong>

            </a>

        </nav>


    </main>



    <!-- =====================================
         NARRATION PLAYER
    ====================================== -->

    <section
        id="narrationPlayer"
        class="narration-player"
        aria-label="Narration player"
        hidden
    >


        <!-- NARRATION SEEK BAR -->

        <div
            id="narrationSeek"
            class="narration-seek"
            role="slider"
            tabindex="0"
            aria-label="Narration position"
            aria-valuemin="1"
            aria-valuemax="1"
            aria-valuenow="1"
        >

            <div
                id="narrationSeekFill"
                class="narration-seek-fill"
            ></div>

        </div>



        <div class="narration-inner">


            <!-- =============================
                 CURRENT POSITION
            ============================== -->

            <div class="narration-information">

                <span class="narration-eyebrow">
                    NOW READING
                </span>

                <strong id="narrationChapter">
                    —
                </strong>

                <span id="narrationPosition">
                    Paragraph 1 of 1
                </span>

            </div>



            <!-- =============================
                 PLAYBACK CONTROLS
            ============================== -->

            <div class="narration-controls">

                <button
                    id="previousParagraph"
                    type="button"
                    aria-label="Previous paragraph"
                    title="Previous paragraph"
                >
                    ‹
                </button>


                <button
                    id="playPause"
                    class="play-button"
                    type="button"
                    aria-label="Play narration"
                    title="Play or pause narration"
                >
                    ▶
                </button>


                <button
                    id="nextParagraph"
                    type="button"
                    aria-label="Next paragraph"
                    title="Next paragraph"
                >
                    ›
                </button>

            </div>



            <!-- =============================
                 NARRATION OPTIONS
            ============================== -->

            <div class="narration-options">


                <!--
                    NEW:
                    DEVICE / AUDIOBOOK ENGINE

                    reader.js will automatically
                    disable Audiobook when the
                    current chapter has no
                    audiobook available.
                -->

                <label id="narrationSourceGroup">

                    <span>
                        NARRATION
                    </span>

                    <select
                        id="narrationSource"
                        aria-label="Narration source"
                    >

                        <option
                            value="drowned-crown"
                            selected
                        >
                            Drowned Crown
                        </option>

                        <option value="device">
                            Device
                        </option>

                    </select>

                </label>



                <!-- DEVICE VOICE -->

                <label id="voiceSelectGroup">

                    <span>
                        VOICE
                    </span>

                    <select
                        id="voiceSelect"
                        aria-label="Narration voice"
                    >

                        <option>
                            Loading voices...
                        </option>

                    </select>

                </label>



                <!-- PLAYBACK SPEED -->

                <label>

                    <span>
                        SPEED
                    </span>

                    <select
                        id="speedSelect"
                        aria-label="Narration speed"
                    >

                        <option value="0.75">
                            0.75×
                        </option>

                        <option value="0.9">
                            0.9×
                        </option>

                        <option
                            value="1"
                            selected
                        >
                            1×
                        </option>

                        <option value="1.1">
                            1.1×
                        </option>

                        <option value="1.25">
                            1.25×
                        </option>

                        <option value="1.5">
                            1.5×
                        </option>

                    </select>

                </label>



                <!-- STOP -->

                <button
                    id="stopNarration"
                    class="small-player-button"
                    type="button"
                    aria-label="Stop narration"
                    title="Stop narration"
                >
                    ■
                </button>



                <!-- CLOSE -->

                <button
                    id="closeNarration"
                    class="small-player-button"
                    type="button"
                    aria-label="Close narration player"
                    title="Close narration player"
                >
                    ×
                </button>


            </div>

        </div>

    </section>



    <!-- =====================================
         DATA
    ====================================== -->

    <script src="data/chapters.js"></script>

    <script src="data/pronunciations.js"></script>

    <script src="data/narration.js"></script>



    <!-- =====================================
         READER
    ====================================== -->

    <script type="module" src="js/reader.js"></script>


</body>

</html>
